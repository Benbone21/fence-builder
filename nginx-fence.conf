# Example nginx site. Point a subdomain at your VPS, then get a cert with certbot.
# Swap 10.0.1.X for the WireGuard IP of the box running the app (or 127.0.0.1 if it runs on the VPS).
server {
    listen 443 ssl;
    server_name fence.example.com;
    # ssl_certificate / ssl_certificate_key lines from certbot go here

    client_max_body_size 20m;
    location / {
        proxy_pass http://10.0.1.X:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 60s;
    }
}
