# Builds the Windows installer (FenceBuilder-Setup-<version>.exe) and attaches it to the release.
#
# Runs when a version tag is pushed (for example v1.1.0), or when a release is published in the
# GitHub website with a new tag. The tag must match the VERSION file (v1.1.0 <-> 1.1.0).
# "Run workflow" on the Actions page builds the installer as a download without releasing it.
name: Release installer

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write  # to create the release and upload the installer to it

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Work out the version
        id: ver
        shell: pwsh
        run: |
          $file = (Get-Content VERSION -Raw).Trim()
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $tag = $env:GITHUB_REF_NAME
            if ($tag.TrimStart('v', 'V') -ne $file) {
              Write-Error "Tag $tag does not match VERSION ($file). Update VERSION, commit, and tag again."
              exit 1
            }
          }
          "version=$file" >> $env:GITHUB_OUTPUT

      - name: Check the Python files compile
        run: python -m py_compile server.py offline.py app.py

      # Starts the app on an empty data folder in a hidden browser, clicks every page, adds a test job
      # and checks the Final bill. If anything is broken the build stops here and no installer is made.
      - name: Smoke test the app
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install "playwright>=1.40,<2"
          python -m playwright install chromium
          python tests/smoke.py --shot smoke-failure.png
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Keep the smoke test screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-failure
          path: smoke-failure.png
          if-no-files-found: ignore

      - name: Build FenceBuilder.exe
        run: |
          python -m pip install "pyinstaller>=6,<7" "pywebview>=5,<6"
          python -m PyInstaller --noconfirm --clean installer/fence-builder.spec

      - name: Check the exe has the app inside
        shell: pwsh
        run: |
          foreach ($f in 'FenceBuilder.exe', '_internal\static\index.html', '_internal\static\view3d.js', '_internal\VERSION', '_internal\update.json') {
            if (-not (Test-Path "dist\FenceBuilder\$f")) { Write-Error "missing $f"; exit 1 }
          }
          $v = (Get-Content dist\FenceBuilder\_internal\VERSION -Raw).Trim()
          if ($v -ne '${{ steps.ver.outputs.version }}') { Write-Error "bundled VERSION is $v"; exit 1 }

      # Code signing is optional. It only happens when the repository has both secrets
      # WINDOWS_CERT_PFX (the .pfx certificate file, base64) and WINDOWS_CERT_PASSWORD.
      # Without them these steps are skipped and the installer is built unsigned, as before.
      - name: Set up code signing (only if a certificate is saved in the secrets)
        shell: pwsh
        env:
          CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if (-not $env:CERT_PFX -or -not $env:CERT_PASSWORD) {
            Write-Host "No code-signing certificate in the repository secrets: building unsigned."
            "SIGN=0" >> $env:GITHUB_ENV
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String(($env:CERT_PFX -replace '\s', '')))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue |
            Where-Object { $_.Directory.Parent.Name -match '^\d+(\.\d+)+$' } | Sort-Object { [version]($_.Directory.Parent.Name) } -Descending | Select-Object -First 1
          if (-not $signtool) { Write-Error "signtool.exe not found (Windows SDK missing on the runner)"; exit 1 }
          "SIGN=1" >> $env:GITHUB_ENV
          "SIGNTOOL=$($signtool.FullName)" >> $env:GITHUB_ENV
          "CERT_FILE=$pfx" >> $env:GITHUB_ENV

      - name: Sign FenceBuilder.exe
        if: env.SIGN == '1'
        shell: pwsh
        env:
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          & $env:SIGNTOOL sign /f $env:CERT_FILE /p $env:CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /d "Fence Builder" dist\FenceBuilder\FenceBuilder.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:SIGNTOOL verify /pa dist\FenceBuilder\FenceBuilder.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { Write-Error "Inno Setup did not install"; exit 1 }
          "ISCC=$iscc" >> $env:GITHUB_ENV

      - name: Build the installer
        shell: pwsh
        run: |
          & $env:ISCC "/DAppVersion=${{ steps.ver.outputs.version }}" installer\fence-builder.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist\installer

      - name: Sign the installer
        if: env.SIGN == '1'
        shell: pwsh
        env:
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $exe = "dist\installer\FenceBuilder-Setup-${{ steps.ver.outputs.version }}.exe"
          & $env:SIGNTOOL sign /f $env:CERT_FILE /p $env:CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /d "Fence Builder Setup" $exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:SIGNTOOL verify /pa $exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Remove the certificate file
        if: always() && env.CERT_FILE != ''
        shell: pwsh
        run: Remove-Item -Force -ErrorAction SilentlyContinue $env:CERT_FILE

      - name: Keep the installer as a download on this run
        uses: actions/upload-artifact@v4
        with:
          name: FenceBuilder-Setup-${{ steps.ver.outputs.version }}
          path: dist/installer/FenceBuilder-Setup-${{ steps.ver.outputs.version }}.exe

      - name: Attach the installer to the release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $exe = "dist/installer/FenceBuilder-Setup-${{ steps.ver.outputs.version }}.exe"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $exe --clobber
          } else {
            gh release create $tag $exe --title "Fence Builder $tag" --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
