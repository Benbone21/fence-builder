# Checks the app and makes the GitHub release when a version tag is pushed (for example v1.8.3).
# Fence Builder is used in a web browser now (a server on this computer, or the shared Docker server),
# so no Windows installer is built any more. The tag must match the VERSION file (v1.8.3 <-> 1.8.3).
# "Run workflow" on the Actions page runs the checks without releasing.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write  # to create the release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Work out the version
        id: ver
        run: |
          file="$(tr -d '\r\n ' < VERSION)"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "${GITHUB_REF_NAME#v}" != "$file" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match VERSION ($file). Update VERSION, commit, and tag again."
            exit 1
          fi
          echo "version=$file" >> "$GITHUB_OUTPUT"

      - name: Check the Python files compile
        run: python -m py_compile server.py offline.py auth.py ground.py

      # Starts the app on an empty data folder in a hidden browser, clicks every page, adds a test job
      # and checks the Final bill, the single-user way and as a shared server with accounts. Then checks
      # the shared server's security: sign-in, lockouts, each person's data kept apart, admin-only pages,
      # requests from other websites. If anything is broken no release is made.
      - name: Test the app in a browser
        run: |
          python -m pip install --upgrade pip
          python -m pip install "playwright>=1.40,<2"
          python -m playwright install --with-deps chromium
          python tests/smoke.py --shot smoke-failure.png
          python tests/test_multiuser.py

      - name: Keep the test screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-failure
          path: smoke-failure.png
          if-no-files-found: ignore

      - name: Make the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --title "Fence Builder $GITHUB_REF_NAME" --generate-notes
          fi
