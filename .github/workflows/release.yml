# Builds the Windows installer (FenceBuilder-Setup-<version>.exe) and attaches it to the release.
#
# Runs when a version tag is pushed (for example v1.1.0), or when a release is published in the
# GitHub website with a new tag. The tag must match the VERSION file (v1.1.0 <-> 1.1.0).
# "Run workflow" on the Actions page builds the installer as a download without releasing it.
name: Release installer

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write  # to create the release and upload the installer to it

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Work out the version
        id: ver
        shell: pwsh
        run: |
          $file = (Get-Content VERSION -Raw).Trim()
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $tag = $env:GITHUB_REF_NAME
            if ($tag.TrimStart('v', 'V') -ne $file) {
              Write-Error "Tag $tag does not match VERSION ($file). Update VERSION, commit, and tag again."
              exit 1
            }
          }
          "version=$file" >> $env:GITHUB_OUTPUT

      - name: Build FenceBuilder.exe
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pyinstaller>=6,<7"
          python -m PyInstaller --noconfirm --clean installer/fence-builder.spec

      - name: Check the exe has the app inside
        shell: pwsh
        run: |
          foreach ($f in 'FenceBuilder.exe', '_internal\static\index.html', '_internal\static\view3d.js', '_internal\VERSION', '_internal\update.json') {
            if (-not (Test-Path "dist\FenceBuilder\$f")) { Write-Error "missing $f"; exit 1 }
          }
          $v = (Get-Content dist\FenceBuilder\_internal\VERSION -Raw).Trim()
          if ($v -ne '${{ steps.ver.outputs.version }}') { Write-Error "bundled VERSION is $v"; exit 1 }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { Write-Error "Inno Setup did not install"; exit 1 }
          "ISCC=$iscc" >> $env:GITHUB_ENV

      - name: Build the installer
        shell: pwsh
        run: |
          & $env:ISCC "/DAppVersion=${{ steps.ver.outputs.version }}" installer\fence-builder.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist\installer

      - name: Keep the installer as a download on this run
        uses: actions/upload-artifact@v4
        with:
          name: FenceBuilder-Setup-${{ steps.ver.outputs.version }}
          path: dist/installer/FenceBuilder-Setup-${{ steps.ver.outputs.version }}.exe

      - name: Attach the installer to the release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $exe = "dist/installer/FenceBuilder-Setup-${{ steps.ver.outputs.version }}.exe"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $exe --clobber
          } else {
            gh release create $tag $exe --title "Fence Builder $tag" --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
